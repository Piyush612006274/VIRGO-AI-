[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virgo-slm"
version = "1.0.0"
description = "Virgo SLM architecture, dataset, training, inference, evaluation, and export stack"
requires-python = ">=3.12,<3.15"

[project.optional-dependencies]
runtime = [
    "torch>=2.2,<3",
    "tokenizers>=0.21,<0.24",
]
training = [
    "torch>=2.2,<3",
    "tokenizers>=0.21,<0.24",
    "numpy>=2,<3",
]
dev = [
    "pytest>=9,<10",
    "ruff>=0.15,<0.16",
    "mypy>=2.3,<3",
]
all = [
    "torch>=2.2,<3",
    "tokenizers>=0.21,<0.24",
    "numpy>=2,<3",
    "pytest>=9,<10",
    "ruff>=0.15,<0.16",
    "mypy>=2.3,<3",
]

[tool.setuptools]
# The pyproject lives inside the package directory itself, so map the
# current directory to the import package name explicitly.
package-dir = { "virgo_slm" = "." }
packages = [
    "virgo_slm",
    "virgo_slm.configs",
    "virgo_slm.dataset",
    "virgo_slm.evaluation",
    "virgo_slm.export",
    "virgo_slm.inference",
    "virgo_slm.instruction",
    "virgo_slm.model",
    "virgo_slm.tokenizer",
    "virgo_slm.tools",
    "virgo_slm.training",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["."]
