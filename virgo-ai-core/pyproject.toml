[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "virgo-ai"
version = "1.0.0"
description = "Local-first desktop personal AI foundation"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Virgo AI Project" }]
scripts = { virgo-ai = "apps.desktop.bootstrap:run" }
dependencies = [
    "faster-whisper>=1.2.1,<1.3",
    "numpy>=2.3,<3",
    "PySide6>=6.11,<6.12",
    "sounddevice>=0.5.5,<0.6",
]

[project.optional-dependencies]
slm = [
    "torch>=2.2,<3",
    "tokenizers>=0.21,<0.24",
]
dev = [
    "black>=26.1,<27",
    "build>=1.5,<2",
    "maturin>=1.14,<2",
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "ruff>=0.15,<0.16",
]

[tool.maturin]
bindings = "pyo3"
manifest-path = "rust-core/Cargo.toml"
module-name = "virgo._rust_core"
python-source = "."

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["virgo", "tests"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = [".", ".."]
